[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "build123d-fiber-kernel"
version = "0.1.0"
description = "Native build123d/OpenCascade geometry service for React"
requires-python = ">=3.11,<3.15"
dependencies = ["build123d==0.13.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "Pillow>=11"]

[project.scripts]
build123d-fiber-kernel = "build123d_fiber.__main__:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/conformance", "tests/review"]
