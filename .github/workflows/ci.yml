name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:api
      - run: npm run typecheck && npm test && npm run build
      - run: npm run test:kernel:minified
      - run: npm run test:browser:fixtures
      - run: PLAYWRIGHT_BROWSERS_PATH=.playwright npx playwright install --with-deps chromium
      - run: npm run test:visual -- --browser-baselines --report-only
      - run: npm run test:cdn
      - run: npm run sandbox:build && npm run test:sandbox && npm run test:sandbox:editor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results
          path: artifacts/
  publish:
    name: Publish to GitHub Packages for jscdn
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-github-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@tscircuit'
      - run: npm ci
      - name: Publish the package version if not already released
        run: node scripts/publish-package.mjs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
