name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: uv sync --extra test --frozen
      - run: npm run generate:api && git diff --exit-code -- lib/generated docs/api-inventory.json
      - run: npm run typecheck && npm test && npm run build
      - run: npm run test:python
      - run: PLAYWRIGHT_BROWSERS_PATH=.playwright npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results
          path: artifacts/
